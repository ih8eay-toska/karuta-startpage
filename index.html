<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3efe7" />
    <meta name="description" content="Toska's card-inspired personal search homepage." />
    <title>桃花</title>
    <link rel="icon" type="image/svg+xml" href="assets/karuta-favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="home">
      <div class="home-layout">
        <section class="orbit-side dark-side" aria-label="Dark card themes">
          <div class="orbit" id="dark-orbit">
            <svg class="orbit-label" viewBox="0 0 160 160" aria-hidden="true">
              <defs><path id="dark-label-path" d="M80,80 m-61,0 a61,61 0 1,1 122,0 a61,61 0 1,1 -122,0" /></defs>
              <circle class="orbit-label-ring" cx="80" cy="80" r="61" />
              <text><textPath href="#dark-label-path" textLength="383" lengthAdjust="spacing">DARK COLLECTION · DARK COLLECTION · DARK COLLECTION · DARK COLLECTION ·</textPath></text>
            </svg>
            <div class="orbit-track"></div>
          </div>
        </section>
        <section class="search-home" aria-label="Search the web">
          <div class="main-section" id="main-section">
            <div class="card-preview-stage">
              <div class="card-slot theme-card-slot is-empty" id="theme-card-slot" aria-label="Selected theme card"><span class="slot-placeholder">SELECT CARD</span></div>
              <div class="card-preview-note" aria-hidden="true"><span>THEME NOTE</span><p>Your theme description will appear here.</p></div>
            </div>
            <h2 class="theme-name" id="theme-name" aria-live="polite">Linen Glow</h2>
            <div class="cover-shell">
              <div class="cover-stack">
                <div class="search-core">
                <div class="brand-row">
                  <h1>Toska<span class="period">.</span></h1>
                </div>
                <form class="search-box" id="search-form" role="search">
                <div class="engine-control">
                  <span class="engine-mark" aria-hidden="true" id="engine-mark">G</span>
                  <button class="engine-picker" id="engine-picker" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="engine-menu">
                    <span id="engine-label">Google</span>
                    <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3" /></svg>
                  </button>
                  <div class="engine-menu" id="engine-menu" role="menu" aria-label="Choose search engine" hidden>
                    <button type="button" role="menuitemradio" aria-checked="true" data-engine="google"><span class="engine-option-mark">G</span><span>Google</span></button>
                    <button type="button" role="menuitemradio" aria-checked="false" data-engine="youtube"><span class="engine-option-mark">▶</span><span>YouTube</span></button>
                  </div>
                  <input id="engine-select" type="hidden" value="google" />
                </div>
                <span class="divider" aria-hidden="true"></span>
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4 4"/></svg>
                <input id="query" name="q" type="search" placeholder="Search the web" autocomplete="off" spellcheck="false" aria-label="Search phrase" />
                <button class="submit-search" type="submit" aria-label="Search">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
                </button>
                </form>
                <div class="home-utilities" role="group" aria-label="Clock and music">
                  <div class="home-clock">
                    <time id="clock-time" aria-label="Current time"><span id="clock-hours-minutes"><span class="clock-digit">-</span><span class="clock-digit">-</span><span class="clock-colon">:</span><span class="clock-digit">-</span><span class="clock-digit">-</span></span><span class="clock-seconds" id="clock-seconds"><span class="clock-colon">:</span><span class="clock-digit">-</span><span class="clock-digit">-</span></span></time>
                    <button class="timezone-pill" id="clock-timezone" type="button" popovertarget="timezone-dialog" aria-haspopup="dialog" aria-controls="timezone-dialog" aria-expanded="false" aria-label="Change clock GMT offset">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>
                      <span id="clock-timezone-label">GMT+7</span>
                    </button>
                  </div>
                  <div class="home-music" role="group" aria-label="Music player">
                    <audio id="music-audio" preload="metadata" src="assets/music/冷夜.mp3" hidden></audio>
                    <button class="music-play" id="music-play" type="button" aria-label="Play 冷夜" aria-pressed="false"><span aria-hidden="true">▶</span></button>
                    <div class="music-track"><span class="music-title" lang="zh">冷夜</span><span class="music-position" id="music-position">0:00 / 0:00</span></div>
                    <label class="quick-link-sr-only" for="music-seek">Track position</label>
                    <input class="music-slider music-seek" id="music-seek" type="range" min="0" max="1000" value="0" disabled />
                    <div class="music-volume-control" id="music-volume-control">
                      <button class="music-volume-toggle" id="music-volume-toggle" type="button" aria-label="Adjust volume" aria-expanded="false" aria-controls="music-volume-panel" title="Volume">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="music-speaker-waves" d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/><path class="music-speaker-muted" d="m16 9 5 6m0-6-5 6"/></svg>
                      </button>
                      <div class="music-volume-panel" id="music-volume-panel" hidden>
                        <div class="music-volume-heading"><label for="music-volume">Volume</label><output id="music-volume-value" for="music-volume" aria-live="off">70%</output></div>
                        <input class="music-slider" id="music-volume" type="range" min="0" max="100" value="70" />
                        <button class="music-mute" id="music-mute" type="button" aria-label="Mute 冷夜" aria-pressed="false">Mute</button>
                      </div>
                    </div>
                    <p class="music-status" id="music-status" role="status" hidden></p>
                  </div>
                </div>
                <nav class="quick-links" aria-label="Right quick links">
                  <div class="quick-link-slot" data-slot="0">
                    <button class="quick-link quick-link-add" type="button" aria-label="Add a quick link" title="Add a quick link">
                      <span aria-hidden="true">+</span>
                    </button>
                  </div>
                  <div class="quick-link-slot" data-slot="1">
                    <button class="quick-link quick-link-add" type="button" aria-label="Add a quick link" title="Add a quick link">
                      <span aria-hidden="true">+</span>
                    </button>
                  </div>
                  <div class="quick-link-slot" data-slot="2">
                    <button class="quick-link quick-link-add" type="button" aria-label="Add a quick link" title="Add a quick link">
                      <span aria-hidden="true">+</span>
                    </button>
                  </div>
                </nav>
                <nav class="quick-links quick-links-left" aria-label="Left quick links">
                  <div class="quick-link-slot" data-slot="3">
                    <button class="quick-link quick-link-add" type="button" aria-label="Add a quick link" title="Add a quick link"><span aria-hidden="true">+</span></button>
                  </div>
                  <div class="quick-link-slot" data-slot="4">
                    <button class="quick-link quick-link-add" type="button" aria-label="Add a quick link" title="Add a quick link"><span aria-hidden="true">+</span></button>
                  </div>
                  <div class="quick-link-slot" data-slot="5">
                    <button class="quick-link quick-link-add" type="button" aria-label="Add a quick link" title="Add a quick link"><span aria-hidden="true">+</span></button>
                  </div>
                </nav>
                </div>
              <section class="saved-divider" id="saved-pages" aria-labelledby="saved-pages-title" data-open="false">
                <div class="saved-divider-content" id="saved-pages-content" inert>
                  <div class="saved-divider-inner">
                    <h2 id="saved-pages-title">Saved pages</h2>
                    <div class="saved-page-list" id="saved-page-list"></div>
                  </div>
                </div>
                <div class="saved-tabs" role="group" aria-label="Saved pages tabs">
                  <button class="saved-tab" type="button" lang="en" data-language="en" aria-expanded="false" aria-controls="saved-pages-content">Saved</button>
                  <button class="saved-tab" type="button" lang="fr" data-language="fr" aria-expanded="false" aria-controls="saved-pages-content">Enregistré</button>
                  <button class="saved-tab" type="button" lang="zh-Hans" data-language="zh" aria-expanded="false" aria-controls="saved-pages-content">已保存</button>
                  <button class="saved-tab" type="button" lang="ja" data-language="ja" aria-expanded="false" aria-controls="saved-pages-content">保存済み</button>
                </div>
              </section>
            </div>
          </div>
        </section>
        <section class="orbit-side light-side" aria-label="Light card themes">
          <div class="orbit" id="light-orbit">
            <svg class="orbit-label" viewBox="0 0 160 160" aria-hidden="true">
              <defs><path id="light-label-path" d="M80,80 m-61,0 a61,61 0 1,1 122,0 a61,61 0 1,1 -122,0" /></defs>
              <circle class="orbit-label-ring" cx="80" cy="80" r="61" />
              <text><textPath href="#light-label-path" textLength="383" lengthAdjust="spacing">LIGHT COLLECTION · LIGHT COLLECTION · LIGHT COLLECTION · LIGHT COLLECTION ·</textPath></text>
            </svg>
            <div class="orbit-track"></div>
          </div>
        </section>
      </div>
    </main>
    <dialog class="quick-link-dialog" id="quick-link-dialog" aria-labelledby="quick-link-dialog-title">
      <form id="quick-link-form">
        <h2 id="quick-link-dialog-title">Add a quick link</h2>
        <label for="quick-link-name">Site name <span>(optional)</span></label>
        <input id="quick-link-name" name="name" type="text" maxlength="60" autocomplete="off" placeholder="Uses the website name by default" />
        <label for="quick-link-url">Website address</label>
        <input id="quick-link-url" name="url" type="text" inputmode="url" autocomplete="url" placeholder="example.com" aria-describedby="quick-link-error" />
        <p class="quick-link-error" id="quick-link-error" aria-live="polite"></p>
        <div class="quick-link-dialog-actions">
          <button class="quick-link-cancel" id="quick-link-cancel" type="button">Cancel</button>
          <button class="quick-link-save" type="submit">Save link</button>
        </div>
      </form>
    </dialog>
    <div class="timezone-popover" id="timezone-dialog" popover="auto" role="dialog" aria-labelledby="timezone-title">
      <form id="timezone-form">
        <h2 id="timezone-title">Set GMT offset</h2>
        <div class="timezone-wheels">
          <div><span class="timezone-wheel-label" id="timezone-sign-label">Sign</span><div class="timezone-wheel-frame"><div class="timezone-wheel" id="timezone-sign" role="listbox" tabindex="0" aria-labelledby="timezone-sign-label"></div></div></div>
          <div><span class="timezone-wheel-label" id="timezone-hours-label">Hours</span><div class="timezone-wheel-frame"><div class="timezone-wheel" id="timezone-hours" role="listbox" tabindex="0" aria-labelledby="timezone-hours-label"></div></div></div>
        </div>
        <div class="quick-link-dialog-actions"><button id="timezone-cancel" type="button">Cancel</button><button class="quick-link-save" type="submit">Done</button></div>
      </form>
    </div>
    <script src="script.js"></script>
  </body>
</html>
